server:
  port: 8080
  mode: debug

database:
  host: postgres
  port: 5432
  user: postgres
  password: "postgres"
  dbname: myplatform
  sslmode: disable

auth:
  jwt_secret: "change-me-in-production"
  access_token_expiry: 15m
  refresh_token_expiry: 168h
  allow_registration: true
  oauth:
    github:
      client_id: ""
      client_secret: ""
      redirect_url: "http://localhost:8080/auth/oauth/github/callback"
    discord:
      client_id: ""
      client_secret: ""
      redirect_url: "http://localhost:8080/auth/oauth/discord/callback"
    # Hosts a business frontend may pass as redirect_uri. After the provider
    # callback the platform 302s the browser here with a one-time exchange_code
    # (login) or bind_result (bind), so this MUST be an allowlist. Exact,
    # case-insensitive host or host:port match. Empty list = OAuth disabled.
    # Override with MYPLATFORM_AUTH_OAUTH_ALLOWED_REDIRECT_HOSTS (comma-separated).
    allowed_redirect_hosts:
      - blog.bgnhub.me
      - localhost

permission:
  seed_defaults: true
  # Shared secret business modules must send as X-Service-Token on
  # POST /api/permissions/registry and POST /api/permissions/check.
  # Empty = no check (a warning is logged); keep those paths off the public
  # reverse proxy regardless. Set via MYPLATFORM_PERMISSION_SERVICE_TOKEN.
  service_token: ""

storage:
  type: local
  max_file_size: 52428800
  local:
    base_path: "./uploads"

imagebed:
  max_file_size: 10485760
  base_path: "imagebed"
